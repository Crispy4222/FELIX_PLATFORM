name: Build FELIX Operating Presence ISO

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-felix-iso.yml'
      - 'core/**'
      - 'iso/**'
      - 'scripts/build-iso.sh'
      - 'scripts/fetch-local-cortex.sh'
  push:
    branches:
      - main
      - 'feat/**'
    paths:
      - '.github/workflows/build-felix-iso.yml'
      - 'core/**'
      - 'iso/**'
      - 'scripts/build-iso.sh'
      - 'scripts/fetch-local-cortex.sh'

permissions:
  contents: read

concurrency:
  group: felix-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build amd64 hybrid image
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache-dependency-path: core/go.mod

      - name: Cache resident cortex build inputs
        uses: actions/cache@v4
        with:
          path: .build-cache
          key: felix-cortex-linux-amd64-llama-b10199-qwen2.5-1.5b-r91cad511

      - name: Verify native control plane
        working-directory: core
        run: |
          go test ./...
          go vet ./...

      - name: Install build and ISO tools
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            cmake \
            curl \
            git \
            pkg-config \
            live-build \
            debootstrap \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-common \
            grub-pc-bin \
            grub-efi-amd64-bin \
            mtools \
            dosfstools \
            rsync

      - name: Build bootable image with resident model
        env:
          FELIX_BUNDLE_MODEL: '1'
        run: bash scripts/build-iso.sh

      - name: Verify bundled cortex source tree
        run: |
          test -x iso/config/includes.chroot/usr/local/sbin/felixd
          test -x iso/config/includes.chroot/usr/local/libexec/felix-llama-server
          MODEL=iso/config/includes.chroot/opt/felix-models/qwen2.5-1.5b-instruct-q4_k_m.gguf
          test -s "$MODEL"
          test "$(stat -c %s "$MODEL")" -gt 1000000000
          test -s iso/config/includes.chroot/usr/share/doc/felix-platform/QWEN2.5-LICENSE
          test -s iso/config/includes.chroot/usr/share/doc/felix-platform/MODEL_SHA256SUMS

      - name: Validate image and boot catalog
        run: |
          ISO=out/felix-presence-os-amd64.iso
          test -s "$ISO"
          file "$ISO" | tee out/file-report.txt
          xorriso -indev "$ISO" -report_el_torito plain | tee out/el-torito-report.txt
          xorriso -indev "$ISO" -find /live -maxdepth 2 -type f -print | tee out/live-files-report.txt
          grep -q '/live/' out/live-files-report.txt
          xorriso -indev "$ISO" -find / -name 'filesystem.squashfs' -print | grep -q filesystem.squashfs
          sha256sum --check out/SHA256SUMS

      - name: Upload bootable ISO
        uses: actions/upload-artifact@v4
        with:
          name: felix-presence-os-amd64
          path: |
            out/felix-presence-os-amd64.iso
            out/SHA256SUMS
            out/file-report.txt
            out/el-torito-report.txt
            out/live-files-report.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
